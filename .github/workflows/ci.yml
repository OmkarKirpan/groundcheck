name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No API keys in tracked files
        run: |
          if git grep -nIE 'sk-or-[A-Za-z0-9_-]{20,}'; then
            echo "::error::Tracked file contains something that looks like an OpenRouter key"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
